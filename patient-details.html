<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient Details</title>
    <link rel="stylesheet" href="/src/css/app.css" />
  </head>

  <body>
    <div class="container">
      <div class="topbar">
        <a href="/patients.html">← Back to Patients</a>
        <span id="statusBadge" class="badge">Loading…</span>
      </div>

      <h1 id="title">Patient</h1>
      <div id="state" class="state">Loading…</div>

      <div class="grid">
        <section class="card">
          <h2>Details</h2>
          <div class="kv">
            <div class="k">Full name</div><div id="dName" class="v">—</div>
            <div class="k">Email</div><div id="dEmail" class="v">—</div>
            <div class="k">Phone</div><div id="dPhone" class="v">—</div>
            <div class="k">Notes</div><div id="dNotes" class="v">—</div>
            <div class="k">Created</div><div id="dCreated" class="v">—</div>
          </div>
        </section>

        <aside class="card">
          <h2>Latest + Indices</h2>
          <div class="kv">
            <div class="k">Latest date</div><div id="iDate" class="v">—</div>
            <div class="k">Weight</div><div id="iWeight" class="v">—</div>
            <div class="k">Height</div><div id="iHeight" class="v">—</div>
            <div class="k">Waist</div><div id="iWaist" class="v">—</div>
          </div>

          <hr />

          <div class="kv">
            <div class="k">BMI</div><div id="iBmi" class="v">—</div>
            <div class="k">BMI category</div><div id="iBmiCat" class="v">—</div>
            <div class="k">WHtR</div><div id="iWhtr" class="v">—</div>
          </div>
        </aside>
      </div>

      <hr />

      <section class="card">
        <h2>Measurements</h2>

        <form id="mForm" style="max-width: 520px;">
          <label>
            Date/time
            <input id="mTakenAt" type="datetime-local" />
          </label>

          <label>
            Weight (kg)
            <input id="mWeight" type="number" step="0.1" min="0" />
          </label>

          <label>
            Height (cm)
            <input id="mHeight" type="number" step="0.1" min="0" />
          </label>

          <label>
            Waist (cm)
            <input id="mWaist" type="number" step="0.1" min="0" />
          </label>

          <label>
            Notes
            <textarea id="mNotes" rows="3"></textarea>
          </label>

          <button type="submit">Add measurement</button>
        </form>

        <div id="mMsg" class="msg"></div>

        <table class="table" aria-label="Measurements table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Weight (kg)</th>
              <th>Height (cm)</th>
              <th>Waist (cm)</th>
              <th>Notes</th>
            </tr>
          </thead>
          <tbody id="mTbody"></tbody>
        </table>
      </section>
    </div>

    <script type="module" src="/src/js/pages/patient-details.js"></script>
  </body>
</html>
